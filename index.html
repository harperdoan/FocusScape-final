<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusScape</title>

    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="prototype.css">
</head>

<body>

    <main class="prototype">

        <header>
            <p class="label">FocusScape</p>

            <h1>Focus Better with an Evolving Soundscape</h1>

            <p class="intro">
                Create a personalised study soundscape and generate subtle variations without interrupting your focus.
            </p>
        </header>

        <!--
        The player groups playback, atmosphere presets and sound controls
        into one interface. This supports both quick preset selection and
        detailed sound customisation during study sessions.
        -->
        <section class="player">

            <div class="session-status">

                <div>
                    <p class="small-label">Current session</p>
                    <p id="status" aria-live="polite">Ready to focus</p>
                </div>

                <button id="playButton">
                    Start Soundscape
                </button>

            </div>

            <div class="preset-section">
                <p class="small-label">ATMOSPHERE PRESETS</p>

                <div class="preset-buttons">
                    <button class="preset-button" data-preset="rainy">
                        Rainy Study
                    </button>

                    <button class="preset-button" data-preset="cafe">
                        Café Focus
                    </button>

                    <button class="preset-button" data-preset="quiet">
                        Quiet Focus
                    </button>
                </div>
            </div>

            <div class="variation-panel">

                <div class="variation-heading">

                    <div>
                        <p class="small-label">Current variation</p>
                        <p class="variation-title" id="variationTitle" aria-live="polite">
                            Variation 1
                        </p>
                    </div>

                    <button id="generateButton">
                        New Variation
                    </button>

                </div>


                <div class="mix-grid">

                    <label class="mix-item" for="rainControl">
                        <span>Rain</span>
                        <strong id="rainValue">30%</strong>
                        <input id="rainControl" type="range" min="0" max="100" value="30">
                    </label>

                    <label class="mix-item" for="cafeControl">
                        <span>Café</span>
                        <strong id="cafeValue">22%</strong>
                        <input id="cafeControl" type="range" min="0" max="100" value="22">
                    </label>

                    <label class="mix-item" for="windControl">
                        <span>Wind</span>
                        <strong id="windValue">18%</strong>
                        <input id="windControl" type="range" min="0" max="100" value="18">
                    </label>

                    <label class="mix-item" for="toneControl">
                        <span>Tone</span>
                        <strong id="toneValue">16%</strong>
                        <input id="toneControl" type="range" min="0" max="100" value="16">
                    </label>

                </div>


                <div class="feedback">

                    <p class="small-label">
                        What changed
                    </p>

                    <div id="feedbackList" class="feedback-list" aria-live="polite">
                        <p>No changes yet.</p>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="prototype.js"></script>

</body>
</html>
